<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="stylesheet" href="/css/style.css">
<link rel="alternate" type="application/atom+xml" title="Blog" href="/blog/feed.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try { var k9sSkin = localStorage.getItem("skin"); if (k9sSkin && k9sSkin !== "stock") document.documentElement.dataset.skin = k9sSkin; } catch (e) {}</script>
</head>
<body data-back="{{back}}">
<div class="k9s">
<header class="top">
{{info}}
{{hints}}
<a class="logo" href="/" aria-label="Home"><pre> __  __
|  \/  | __ _ _ __ ___ ___  ___
| |\/| |/ _` | '__/ __/ _ \/ __|
| |  | | (_| | | | (_| (_) \__ \
|_|  |_|\__,_|_|  \___\___/|___/</pre></a>
</header>
<div class="prompt" hidden><span class="mode">&gt;</span><input aria-label="Command" autocomplete="off" spellcheck="false"></div>
<section class="frame">
<h1 class="frame-title">{{frame}}</h1>
<div class="view" tabindex="-1">
{{content}}
</div>
</section>
<footer class="bottom"><nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav><span class="flash{{flash_class}}">{{flash}}</span></footer>
</div>
<script src="/k9s.js" defer></script>
</body>
</html>
